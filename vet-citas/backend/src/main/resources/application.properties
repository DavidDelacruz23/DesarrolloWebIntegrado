# Configuración común. Las variables de entorno evitan guardar tu contraseña de MySQL en el proyecto.
spring.application.name=gestion-citas-veterinarias
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vet_citas_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# update es cómodo para el avance académico: conserva datos y agrega las tablas que faltan.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# La página /api-docs.html integra Swagger con el token CSRF de la sesión.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
spring.messages.basename=messages
