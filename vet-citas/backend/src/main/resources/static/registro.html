<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | VetCitas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="auth-page">
    <div class="auth-contenedor">

        <aside class="auth-panel-lateral">
            <div class="icono-pata">🐾</div>
            <h1>VetCitas</h1>
            <p>
                Crea tu cuenta de <strong>cliente</strong> para reservar citas
                para tu mascota, consultar tus reservas y organizar
                tus próximas visitas.
            </p>
        </aside>

        <section class="auth-formulario-wrapper">
            <h2>Crear cuenta de cliente</h2>
            <p class="auth-subtitulo">Todos los campos son obligatorios</p>

            <div id="mensajeGlobal" class="mensaje-global"></div>

            <form id="formRegistro" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. María Pérez" autocomplete="name">
                    <span class="mensaje-error-campo" id="errorNombre"></span>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email">
                    <span class="mensaje-error-campo" id="errorCorreo"></span>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej. 987654321" autocomplete="tel">
                    <span class="mensaje-error-campo" id="errorTelefono"></span>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                    <span class="mensaje-error-campo" id="errorPassword"></span>
                </div>

                <button type="submit" class="boton-primario" id="btnRegistro">Crear cuenta</button>
            </form>

            <a href="login.html" class="enlace-secundario">¿Ya tienes cuenta? Inicia sesión</a>
        </section>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
