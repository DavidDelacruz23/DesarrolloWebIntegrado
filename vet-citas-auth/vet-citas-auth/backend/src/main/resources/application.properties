# =====================================================================
# CONFIGURACION DE LA APLICACION - Sistema de Gestion de Citas Veterinarias
# =====================================================================

# Nombre de la aplicacion (aparece en los logs de arranque)
spring.application.name=gestion-citas-veterinarias

# ---------------------------------------------------------------------
# Conexion a la base de datos MySQL
# Cambia "root" y "tu_password" por tus credenciales reales de MySQL.
# El parametro "createDatabaseIfNotExist=true" evita que falle el
# arranque si aun no ejecutaste el script schema.sql manualmente.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/vet_citas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# Configuracion de JPA / Hibernate
# ---------------------------------------------------------------------
# ddl-auto=update -> Hibernate crea/actualiza automaticamente las
# tablas segun las entidades @Entity si aun no existen. Es comodo para
# desarrollo, pero en producción se recomienda usar "validate" o
# "none" y controlar los cambios de esquema con migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola las sentencias SQL que Hibernate ejecuta (util
# para el curso, para explicar en la presentacion que SI se esta
# hablando con la base de datos).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto especifico de MySQL 8 para que Hibernate genere el SQL
# correcto (tipos de datos, sintaxis de AUTO_INCREMENT, etc.)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---------------------------------------------------------------------
# Puerto del servidor embebido (Tomcat)
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
# Configuracion de la sesion HTTP (usada para la autenticacion estricta)
# ---------------------------------------------------------------------
server.servlet.session.timeout=30m
